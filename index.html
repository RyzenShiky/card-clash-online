<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Card Clash — arena kartu online. Ranked, casual, solo. Developed by RyzenShiky.">
    <meta property="og:title" content="Card Clash">
    <meta property="og:description" content="Online card arena — ranked matchmaking, bots, leaderboard.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./icons/icon-512.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Card Clash">
    <meta name="twitter:description" content="Online card arena by RyzenShiky">
    <meta name="twitter:image" content="./icons/icon-512.svg">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icons/icon-192.svg">
    <title>Card Clash</title>
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen">
            <div class="loader"></div>
            <p>Memulai Card Clash...</p>
        </div>
        <div id="menu-screen" class="screen hidden"></div>
        <div id="lobby-screen" class="screen hidden"></div>
        <div id="game-screen" class="screen hidden"></div>
    </div>

    <script type="module" src="./src/main.js?v=6"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js?v=6").catch(() => {});
        });
      }
    </script>
</body>
</html>
