<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Clash</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen">
            <div class="loader"></div>
            <p>Memulai Card Clash...</p>
        </div>
        <div id="menu-screen" class="screen hidden"></div>
        <div id="lobby-screen" class="screen hidden"></div>
        <div id="game-screen" class="screen hidden"></div>
    </div>
    <script type="module" src="./src/main.js?v=4"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js?v=4").catch(() => {});
        });
      }
    </script>
</body>
</html>
